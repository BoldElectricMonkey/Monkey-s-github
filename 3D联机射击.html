<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>狂电猴 3D 联机射击</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a0d14'/%3E%3Cpath d='M32 8v48M8 32h48' stroke='%232fe6c8' stroke-width='7' stroke-linecap='round'/%3E%3Ccircle cx='32' cy='32' r='6' fill='%23ff9f43'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#0a0d14; --panel:#121826; --panel-2:#0e1420; --line:#222c3f;
  --txt:#e2ebf6; --dim:#7d8ba3; --cyan:#2fe6c8; --cyan-d:#14b8a0;
  --orange:#ff9f43; --red:#ff4757; --green:#2fe08a; --yellow:#ffd23e;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  background:var(--bg); color:var(--txt);
  font-family:"Segoe UI","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  overflow:hidden; -webkit-font-smoothing:antialiased;
}
#game-canvas{position:fixed; inset:0; width:100%; height:100%; display:none; cursor:crosshair; touch-action:none;}

/* ===== 主菜单 ===== */
#menu{
  position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
  background:
    radial-gradient(1100px 520px at 72% 18%, rgba(47,230,200,.09), transparent 60%),
    radial-gradient(900px 480px at 18% 82%, rgba(255,159,67,.07), transparent 60%),
    radial-gradient(700px 400px at 50% 50%, rgba(64,90,140,.08), transparent 70%),
    var(--bg);
  z-index:20;
}
#menu::before{
  content:""; position:absolute; inset:0;
  background-image:
    linear-gradient(rgba(47,230,200,.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(47,230,200,.035) 1px, transparent 1px);
  background-size:44px 44px;
  pointer-events:none;
}
.panel{
  position:relative; width:min(580px,94vw); padding:42px 46px 36px;
  background:linear-gradient(180deg,rgba(20,27,43,.94),rgba(10,13,20,.96));
  border:1px solid var(--line); border-radius:18px;
  box-shadow:0 30px 80px rgba(0,0,0,.55), 0 0 0 1px rgba(47,230,200,.05) inset;
  text-align:center;
}
.badge{
  display:inline-flex; align-items:center; gap:8px; font-size:13px; color:var(--orange);
  letter-spacing:2px; margin-bottom:16px; font-weight:600;
}
.badge::before,.badge::after{content:""; width:26px; height:1px; background:rgba(255,159,67,.5);}
h1{
  font-size:clamp(34px,6vw,50px); font-weight:800; letter-spacing:6px; line-height:1.15;
  background:linear-gradient(90deg,#e8f6ff 10%,#8fe9d6 55%,#2fe6c8);
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
.subtitle{
  margin-top:6px; font-size:15px; letter-spacing:8px; color:var(--dim); font-weight:600;
}
.author{
  margin-top:14px; font-size:13px; color:var(--dim); letter-spacing:1px;
}
.author b{color:var(--orange); font-weight:700;}
.fields{margin-top:28px; display:flex; flex-direction:column; gap:14px; text-align:left;}
label{font-size:13px; color:var(--dim); letter-spacing:2px; display:flex; align-items:center; gap:8px;}
label::after{content:""; flex:1; height:1px; background:var(--line);}
input{
  width:100%; padding:12px 14px; font-size:16px; color:var(--txt);
  background:var(--panel-2); border:1px solid var(--line); border-radius:10px;
  outline:none; transition:border-color .15s;
  font-family:inherit;
}
input:focus{border-color:var(--cyan); box-shadow:0 0 0 3px rgba(47,230,200,.12);}
.room-row{display:flex; gap:10px;}
.room-row input{text-transform:uppercase; letter-spacing:4px; font-weight:700;}
.btns{margin-top:24px; display:flex; flex-direction:column; gap:12px;}
.btn{
  width:100%; padding:14px; font-size:16px; font-weight:700; letter-spacing:3px;
  border-radius:12px; border:1px solid transparent; cursor:pointer;
  font-family:inherit; transition:transform .06s, filter .15s, background .15s;
  user-select:none;
}
.btn:active{transform:translateY(1px);}
.btn:disabled{opacity:.45; cursor:not-allowed;}
.btn-primary{background:var(--cyan-d); color:#04231d; box-shadow:0 8px 26px rgba(47,230,200,.25);}
.btn-primary:hover{background:#19c9aa; filter:brightness(1.06);}
.btn-alt{background:transparent; color:var(--orange); border-color:rgba(255,159,67,.55);}
.btn-alt:hover{background:rgba(255,159,67,.1);}
.btn-ghost{background:var(--panel-2); color:var(--dim); border-color:var(--line); font-weight:600;}
.btn-ghost:hover{color:var(--txt); border-color:#3a4a68;}
.hints{
  margin-top:26px; text-align:left; border-top:1px solid var(--line); padding-top:18px;
  display:grid; grid-template-columns:1fr 1fr; gap:10px 22px; font-size:13px; color:var(--dim);
}
.hints div{display:flex; align-items:center; gap:8px;}
kbd{
  display:inline-block; min-width:26px; text-align:center; padding:2px 7px;
  background:var(--panel-2); border:1px solid #33405c; border-bottom-width:2px;
  border-radius:6px; font-size:12px; font-family:inherit; color:var(--cyan);
}
.version{margin-top:20px; font-size:11px; color:#3d4a63; letter-spacing:1px;}

/* ===== HUD ===== */
#hud{position:fixed; inset:0; pointer-events:none; display:none; z-index:10;}
#hud .el{position:absolute;}
#roombox{left:18px; top:16px; pointer-events:auto;}
#roombox .tag{font-size:11px; letter-spacing:2px; color:var(--dim);}
#roombox .code{
  margin-top:4px; font-size:26px; font-weight:800; letter-spacing:5px; color:var(--cyan);
  font-family:"Cascadia Code",Consolas,monospace;
}
#roombox .meta{display:flex; gap:10px; align-items:center; margin-top:5px; font-size:12px; color:var(--dim);}
.dot{width:8px; height:8px; border-radius:50%; background:var(--green); display:inline-block; animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}
#roombox button{
  pointer-events:auto; background:var(--panel-2); color:var(--dim); border:1px solid var(--line);
  border-radius:7px; padding:3px 10px; font-size:12px; cursor:pointer; font-family:inherit;
}
#roombox button:hover{color:var(--cyan); border-color:var(--cyan);}
#plist{right:16px; top:16px; width:212px; display:flex; flex-direction:column; gap:6px;}
#plist .row{
  display:flex; align-items:center; gap:8px; padding:5px 8px; border-radius:8px;
  background:rgba(10,13,20,.62); border:1px solid rgba(255,255,255,.05); font-size:12px;
}
#plist .dotc{width:9px; height:9px; border-radius:50%; flex:none;}
#plist .nm{flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
#plist .k{color:var(--orange); font-family:Consolas,monospace; font-size:11px;}
#plist .bar{width:46px; height:5px; border-radius:3px; background:#1b2434; overflow:hidden; flex:none;}
#plist .bar i{display:block; height:100%; background:var(--green); width:100%;}
#plist .me{border-color:rgba(47,230,200,.45);}
#scorebox{left:18px; bottom:22px; font-size:13px; color:var(--dim);}
#scorebox b{font-size:30px; color:var(--orange); font-family:Consolas,monospace;}
#hpbox{left:18px; bottom:52px; width:min(280px,44vw);}
#hpbar{height:13px; border-radius:7px; background:#141a2a; border:1px solid #24304a; overflow:hidden;}
#hpbar i{display:block; height:100%; width:100%; background:linear-gradient(90deg,#2fe08a,#2fe6c8); transition:width .12s;}
#hptext{margin-top:5px; font-size:12px; color:var(--dim); display:flex; justify-content:space-between; font-family:Consolas,monospace;}
#ammo{
  position:absolute; left:calc(18px + min(280px,44vw) + 16px); bottom:52px; font-size:20px;
  color:var(--txt); font-family:Consolas,monospace; letter-spacing:1px;
}
#ammo b{color:var(--orange);}
#mute{
  pointer-events:auto; position:absolute; right:16px; bottom:18px; padding:6px 12px;
  background:rgba(10,13,20,.62); border:1px solid var(--line); color:var(--dim);
  border-radius:9px; font-size:12px; cursor:pointer; font-family:inherit; letter-spacing:1px;
}
#mute:hover{color:var(--cyan); border-color:var(--cyan);}
#crosshair{
  left:50%; top:50%; width:22px; height:22px; transform:translate(-50%,-50%);
}
#crosshair::before,#crosshair::after{
  content:""; position:absolute; background:rgba(226,235,246,.75); mix-blend-mode:difference;
}
#crosshair::before{left:50%; top:0; width:2px; height:100%; transform:translateX(-50%);}
#crosshair::after{top:50%; left:0; height:2px; width:100%; transform:translateY(-50%);}
#hitmarker{
  left:50%; top:50%; width:26px; height:26px; transform:translate(-50%,-50%) rotate(45deg);
  opacity:0; transition:opacity .05s;
}
#hitmarker::before,#hitmarker::after{
  content:""; position:absolute; background:#fff; mix-blend-mode:difference;
}
#hitmarker::before{left:50%; top:0; width:2px; height:100%; transform:translateX(-50%);}
#hitmarker::after{top:50%; left:0; height:2px; width:100%; transform:translateY(-50%);}
#killfeed{right:16px; bottom:52px; width:260px; display:flex; flex-direction:column; gap:5px; align-items:flex-end;}
#killfeed .f{
  padding:5px 11px; border-radius:8px; background:rgba(10,13,20,.72); border:1px solid rgba(255,255,255,.07);
  font-size:12.5px; animation:feedin .18s ease-out;
}
#killfeed .f.me{color:var(--cyan); border-color:rgba(47,230,200,.35);}
@keyframes feedin{from{transform:translateX(24px); opacity:0;}to{transform:none; opacity:1;}}
#vignette{
  inset:0; background:radial-gradient(ellipse at center, transparent 46%, rgba(255,71,87,.5) 100%);
  opacity:0; pointer-events:none;
}
#lockHint{
  inset:0; display:none; align-items:center; justify-content:center; flex-direction:column; gap:14px;
  background:rgba(6,8,12,.35); z-index:12; text-align:center;
}
#lockHint .ph{font-size:22px; letter-spacing:4px; color:#fff;}
#lockHint .ps{font-size:13px; color:var(--dim);}
#overlay{
  inset:0; display:none; align-items:center; justify-content:center; z-index:14;
  background:rgba(6,8,12,.6);
}
#overlay .panel{width:min(420px,90vw); padding:30px; text-align:center;}
#overlay h2{font-size:24px; letter-spacing:3px; margin-bottom:10px;}
#overlay p{color:var(--dim); font-size:14px; line-height:1.8;}
#overlay .btns{margin-top:20px;}
#connectOverlay{display:none;}
.spin{
  width:44px; height:44px; margin:0 auto 18px; border-radius:50%;
  border:3px solid var(--line); border-top-color:var(--cyan);
  animation:spin 1s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}
#toasts{
  left:50%; bottom:110px; transform:translateX(-50%); display:flex; flex-direction:column;
  gap:8px; align-items:center; z-index:30;
}
#toasts .t{
  padding:9px 18px; border-radius:10px; background:#1a2133; border:1px solid rgba(255,159,67,.5);
  color:#ffd9b0; font-size:14px; animation:feedin .2s ease-out; max-width:90vw; text-align:center;
}
#deathInfo{color:#ffd23e;}
</style>
</head>
<body>

<canvas id="game-canvas"></canvas>

<!-- ===== 主菜单 ===== -->
<div id="menu">
  <div class="panel">
    <div class="badge">联机对战 · FPS</div>
    <h1>狂电猴</h1>
    <div class="subtitle">3D 联机射击</div>
    <div class="author">作者：<b>果敢的狂电猴</b></div>
    <div class="fields">
      <label>玩家昵称</label>
      <input id="nick" maxlength="12" autocomplete="off" spellcheck="false">
      <label>房间号（创建房间后显示）</label>
      <div class="room-row">
        <input id="roomcode" maxlength="5" autocomplete="off" spellcheck="false" placeholder="5 位房间号">
        <button class="btn btn-ghost" id="btn-gen" style="width:120px; padding:0;" title="随机生成一个房间号">随机</button>
      </div>
    </div>
    <div class="btns">
      <button class="btn btn-primary" id="btn-create">创建房间</button>
      <button class="btn btn-alt" id="btn-join">加入房间</button>
      <button class="btn btn-ghost" id="btn-solo">单人试玩</button>
    </div>
    <div class="hints">
      <div><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 移动</div>
      <div><kbd>鼠标</kbd> 瞄准 · 左键 射击</div>
      <div><kbd>空格</kbd> 跳跃</div>
      <div><kbd>Shift</kbd> 加速</div>
      <div><kbd>R</kbd> 换弹</div>
      <div><kbd>Esc</kbd> 暂停菜单</div>
    </div>
    <div class="version">房间制联机 · 满员 8 人 · 支持跨设备组队对战</div>
  </div>
</div>

<!-- ===== 游戏 HUD ===== -->
<div id="hud">
  <div class="el" id="roombox">
    <div class="tag">房间号</div>
    <div class="code" id="roomcodeView">------</div>
    <div class="meta"><span class="dot"></span><span id="onlineCount">在线 1/8</span><button id="btn-copy">复制</button></div>
  </div>
  <div class="el" id="plist"></div>
  <div class="el" id="scorebox" style="display:none;"><b id="scoreNum">0</b>&nbsp; 命中</div>
  <div class="el" id="hpbox">
    <div id="hpbar"><i id="hpfill"></i></div>
    <div id="hptext"><span id="hpval">100</span><span id="gunstate">30 / ∞</span></div>
  </div>
  <div class="el" id="ammo"></div>
  <div class="el" id="crosshair"></div>
  <div class="el" id="hitmarker"></div>
  <div class="el" id="killfeed"></div>
  <div class="el" id="vignette"></div>
  <button class="el" id="mute">音效：开</button>
</div>

<div id="lockHint"><div class="ph">点击画面进入战斗</div><div class="ps">鼠标将被锁定用于瞄准 · 按 Esc 呼出暂停菜单</div></div>

<div id="overlay">
  <div class="panel" id="pausePanel">
    <h2>已暂停</h2>
    <p id="pauseInfo">游戏进行中</p>
    <div class="btns"><button class="btn btn-primary" id="btn-resume">继续游戏</button><button class="btn btn-ghost" id="btn-leave">返回主菜单</button></div>
  </div>
  <div class="panel" id="deathPanel">
    <h2 id="deathTitle">你被击败了</h2>
    <p id="deathInfo">3 秒后重生…</p>
  </div>
</div>

<div id="connectOverlay" class="panel" style="position:fixed; inset:0; margin:auto; width:min(420px,90vw); height:200px; text-align:center; display:none; z-index:25; align-items:center; justify-content:center; flex-direction:column;">
  <div class="spin"></div>
  <div style="font-size:16px; letter-spacing:2px; color:var(--txt);">正在连接房间…</div>
</div>

<div id="toasts"></div>

<script>
/* =========================================================
   狂电猴 3D 联机射击 · 作者：果敢的狂电猴
   技术栈：Three.js(r128) + PeerJS 点对点联机，单文件自包含
   ========================================================= */
'use strict';

/* ---------- 常量 ---------- */
var ARENA = 50, WALL_H = 5, EYE = 1.62, PLAYER_R = 0.58;
var GRAV = -26, JUMP = 10.5, MOVE = 9, SPRINT = 13.5;
var DMG = 22, FIRE_INTERVAL = 0.11, MAG = 30, RELOAD_T = 1.4;
var BULLET_SPEED = 125, BULLET_RANGE = 140;
var MAX_PLAYERS = 8;
var SENS = 0.0022;
var ROOM_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
var COLOR_HEX = ['#ff5d5d', '#4aa4ff', '#2fe08a', '#ffb02e', '#c07bff', '#ff6ed8', '#37e6e0', '#fff2b8'];
var OBSTACLES = [
  {x:-22,z:-18,sx:7,sz:7,h:3.2},{x:22,z:-18,sx:7,sz:7,h:3.2},
  {x:-22,z:18,sx:7,sz:7,h:3.2},{x:22,z:18,sx:7,sz:7,h:3.2},
  {x:-10,z:-10,sx:4,sz:4,h:2.6},{x:10,z:10,sx:4,sz:4,h:2.6},
  {x:-10,z:10,sx:4,sz:4,h:2.6},{x:10,z:-10,sx:4,sz:4,h:2.6},
  {x:0,z:0,sx:11,sz:11,h:4.4},
  {x:0,z:-30,sx:8,sz:3,h:2.2},{x:0,z:30,sx:8,sz:3,h:2.2},
  {x:-30,z:0,sx:3,sz:8,h:2.2},{x:30,z:0,sx:3,sz:8,h:2.2},
  {x:-38,z:-30,sx:4.5,sz:4.5,h:2.6},{x:38,z:30,sx:4.5,sz:4.5,h:2.6}
];
var SPAWNS = [
  {x:-40,z:-40},{x:40,z:-40},{x:-40,z:40},{x:40,z:40},
  {x:0,z:-44},{x:0,z:44},{x:-44,z:0},{x:44,z:0}
];

/* ---------- 全局状态 ---------- */
var mode = 'menu';            // menu / game
var solo = false;
var scene, camera, renderer, clock;
var me = null;                // 本地玩家状态
var remotes = new Map();      // pid -> {pid,name,color,mesh,hp,alive,k,d,tx,ty,tz,tr}
var bullets = [], bPool = [];
var parts = [], tracers = [];
var targets = [];             // 单人试玩目标
var keys = {}, locked = false, mouseDown = false;
var lastShot = 0, reloading = false, reloadT = 0;
var lastHitBy = 0, respawnT = 0;
var stateTimer = 0, listTimer = 0, hmT = 0, vignette = 0;
var recoil = 0, bobT = 0, gunObj = null;
var score = 0;
var audio = { ctx:null, gain:null, on:true };
var myName = '狂电猴';

function $(id){ return document.getElementById(id); }
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function rnd(a,b){ return a + Math.random()*(b-a); }
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function genCode(){ var s=''; for(var i=0;i<5;i++) s+=ROOM_CHARS[Math.floor(Math.random()*ROOM_CHARS.length)]; return s; }

/* ---------- 音频（用户手势后启动） ---------- */
function ensureAudio(){
  if(audio.ctx){ if(audio.ctx.state==='suspended') audio.ctx.resume(); return; }
  var AC = window.AudioContext || window.webkitAudioContext;
  if(!AC) return;
  audio.ctx = new AC();
  audio.gain = audio.ctx.createGain();
  audio.gain.gain.value = 0.35;
  audio.gain.connect(audio.ctx.destination);
}
function tone(f0,f1,dur,type,vol){
  if(!audio.ctx || !audio.on) return;
  var t = audio.ctx.currentTime, o = audio.ctx.createOscillator(), g = audio.ctx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f0,t);
  o.frequency.exponentialRampToValueAtTime(Math.max(30,f1), t+dur);
  g.gain.setValueAtTime(vol,t);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g); g.connect(audio.gain);
  o.start(t); o.stop(t+dur+0.03);
}
function noiseHit(dur,vol,fc){
  if(!audio.ctx || !audio.on) return;
  var t = audio.ctx.currentTime, len = Math.max(1, Math.floor(audio.ctx.sampleRate*dur));
  var buf = audio.ctx.createBuffer(1,len,audio.ctx.sampleRate);
  var d = buf.getChannelData(0);
  for(var i=0;i<len;i++) d[i] = Math.random()*2-1;
  var src = audio.ctx.createBufferSource(); src.buffer = buf;
  var f = audio.ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value = fc;
  var g = audio.ctx.createGain();
  g.gain.setValueAtTime(vol,t);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  src.connect(f); f.connect(g); g.connect(audio.gain);
  src.start(t);
}
function sndShot(){ noiseHit(0.09,0.5,2200); tone(340,80,0.1,'sawtooth',0.22); }
function sndHit(){ tone(1500,900,0.06,'square',0.13); }
function sndKill(){ tone(660,900,0.07,'square',0.18); setTimeout(function(){ tone(480,1300,0.11,'square',0.18); },70); }
function sndHurt(){ tone(170,70,0.2,'sawtooth',0.35); }
function sndReload(){ tone(950,380,0.05,'square',0.1); }
function sndSpawn(){ tone(280,920,0.18,'sine',0.18); }
function sndJump(){ tone(200,160,0.07,'triangle',0.07); }

/* ---------- 轻量 UI ---------- */
function toast(msg){
  var t = document.createElement('div');
  t.className = 't'; t.textContent = msg;
  $('toasts').appendChild(t);
  setTimeout(function(){ if(t.parentNode) t.parentNode.removeChild(t); }, 3600);
}
function feed(msg, meKill){
  var kf = $('killfeed');
  var f = document.createElement('div');
  f.className = 'f' + (meKill ? ' me' : '');
  f.textContent = msg;
  kf.appendChild(f);
  while(kf.children.length > 6) kf.removeChild(kf.firstChild);
  setTimeout(function(){ if(f.parentNode) f.parentNode.removeChild(f); }, 4200);
}
function showConnect(show){
  $('connectOverlay').style.display = show ? 'flex' : 'none';
}
function nameOf(pid){
  if(pid === Net.selfId) return myName;
  var r = remotes.get(pid);
  return r ? r.name : ('玩家' + pid);
}
function colorOf(pid){
  if(pid === Net.selfId) return '#2fe6c8';
  var r = remotes.get(pid);
  return r ? r.color : '#ffffff';
}

/* ---------- 联网模块（PeerJS） ---------- */
var Net = {
  peer:null, conn:null, host:false, code:'', selfId:0,
  conns:new Map(), nextPid:1,
  onData:null, onPeerJoin:null, onPeerLeave:null, onHostLeft:null,
  onError:null,
  startHost:function(code, cb){
    var self = this;
    self.host = true; self.code = code; self.nextPid = 2; self.conns.clear(); // pid 1 预留给房主自己
    self.peer = new Peer('kdm-' + code);
    self.peer.on('open', cb);
    self.peer.on('connection', function(c){ self.hostConn(c); });
    self.peer.on('error', function(e){
      if(e.type === 'unavailable-id'){
        self.close();
        var c2 = genCode(); $('roomcode').value = c2;
        setTimeout(function(){ hostRoom(); }, 120);
      } else if(self.onError){ self.onError(e); }
    });
  },
  hostConn:function(c){
    var self = this, wrap = { conn:c, pid:0, name:'' };
    c.on('data', function(d){
      var m;
      try{ m = typeof d === 'string' ? JSON.parse(d) : d; }catch(e){ return; }
      if(!wrap.pid){
        if(m.t !== 'j') return;
        if(self.nextPid > MAX_PLAYERS){
          try{ c.send(JSON.stringify({t:'full'})); }catch(e){}
          setTimeout(function(){ try{ c.close(); }catch(e){} }, 50);
          return;
        }
        wrap.pid = self.nextPid++; wrap.name = m.n || '玩家';
        wrap.color = COLOR_HEX[(wrap.pid-1) % COLOR_HEX.length];
        self.conns.set(wrap.pid, wrap);
        var ps = [{i:1, n:myName, c:COLOR_HEX[0]}];
        self.conns.forEach(function(w){ ps.push({i:w.pid, n:w.name, c:w.color}); });
        try{ c.send(JSON.stringify({t:'w', s:wrap.pid, ps:ps})); }catch(e){}
        var np = {t:'np', p:{i:wrap.pid, n:wrap.name, c:wrap.color}};
        self.bcast(np, 0);
        if(self.onData) self.onData(np);
        if(self.onPeerJoin) self.onPeerJoin(wrap.pid);
      } else {
        m.id = wrap.pid;
        if(self.onData) self.onData(m);
        self.bcast(m, wrap.pid);
      }
    });
    c.on('close', function(){
      if(wrap.pid){
        self.conns.delete(wrap.pid);
        var bye = {t:'bye', i:wrap.pid};
        self.bcast(bye, wrap.pid);
        if(self.onData) self.onData(bye);
        if(self.onPeerLeave) self.onPeerLeave(wrap.pid);
      }
    });
    c.on('error', function(){});
  },
  bcast:function(m, except){
    var str = null;
    this.conns.forEach(function(w){
      if(except && w.pid === except) return;
      if(!str) str = JSON.stringify(m);
      try{ w.conn.send(str); }catch(e){}
    });
  },
  startJoin:function(code, cb){
    var self = this;
    self.host = false; self.code = code;
    self.peer = new Peer();
    self.peer.on('open', function(){
      self.conn = self.peer.connect('kdm-' + code, {reliable:true});
      self.conn.on('open', cb);
      self.conn.on('data', function(d){
        var m;
        try{ m = typeof d === 'string' ? JSON.parse(d) : d; }catch(e){ return; }
        if(self.onData) self.onData(m);
      });
      self.conn.on('close', function(){ if(self.onHostLeft) self.onHostLeft(); });
      self.conn.on('error', function(e){ if(self.onError) self.onError(e); });
    });
    self.peer.on('error', function(e){ if(self.onError) self.onError(e); });
  },
  send:function(m){
    if(this.host){ m.id = this.selfId; this.bcast(m, 0); }
    else if(this.conn && this.conn.open){ try{ this.conn.send(JSON.stringify(m)); }catch(e){} }
  },
  close:function(){
    try{ if(this.peer) this.peer.destroy(); }catch(e){}
    this.peer = null; this.conn = null; this.conns.clear(); this.nextPid = 1;
  }
};

function makeTextSprite(text, color){
  var cv = document.createElement('canvas');
  cv.width = 256; cv.height = 64;
  var cx = cv.getContext('2d');
  cx.font = '600 32px "Microsoft YaHei","Segoe UI",sans-serif';
  cx.textAlign = 'center'; cx.textBaseline = 'middle';
  cx.shadowColor = 'rgba(0,0,0,0.95)'; cx.shadowBlur = 10;
  cx.fillStyle = color;
  cx.fillText(text, 128, 32);
  var tex = new THREE.CanvasTexture(cv);
  var sp = new THREE.Sprite(new THREE.SpriteMaterial({map:tex, transparent:true, depthTest:true}));
  sp.scale.set(2.2, 0.55, 1);
  sp.position.y = 2.4;
  return sp;
}

  var head = new THREE.Mesh(new THREE.SphereGeometry(0.26,14,12), new THREE.MeshLambertMaterial({color:c}));

  var glow = new THREE.Mesh(new THREE.BoxGeometry(0.7,0.06,0.5), new THREE.MeshBasicMaterial({color:c}));

function addRemote(p){

/* ---------- 粒子 / 曳光 ---------- */
function burst(pos, color){
  var n = 8;
  for(var i=0;i<n;i++){
    var p = parts[i % parts.length];
    p.on = true; p.max = 0.5; p.life = 0.5;
    p.m.visible = true;
    p.m.material.color.set(color || 0xffa94d);
    p.m.material.opacity = 1;
    p.m.position.copy(pos);
    p.v.set(rnd(-7,7), rnd(2,9), rnd(-7,7));
  }
}
function spawnTracer(o){
  var t = tracers[0];
  for(var i=1;i<tracers.length;i++){ if(!tracers[i].m.visible){ t = tracers[i]; break; } }
  var pos = t.m.geometry.attributes.position;
  pos.setXYZ(0, o.x, o.y, o.z);
  pos.setXYZ(1, o.x+o.dx*1.1, o.y+o.dy*1.1, o.z+o.dz*1.1);
  pos.needsUpdate = true;
  t.m.visible = true; t.life = 0.09;
  t.m.material.opacity = 0.85;
}

/* ---------- 游戏流程 ---------- */
function startGame(playerList, isSolo){
  solo = isSolo;
  mode = 'game';
  initScene();
  me = {x:rnd(-8,8), z:rnd(-8,8), y:0, ry:rnd(-3,3), pitch:0, vy:0, hp:100, alive:true,
        ammo:MAG, kills:0, deaths:0, lastHitBy:0, respawnT:0, onGround:true};
  remotes.clear(); targets = []; score = 0;
  lastShot = 0; reloading = false; reloadT = 0; stateTimer = 0; listTimer = 0;
  me.x = SPAWNS[Math.floor(Math.random()*SPAWNS.length)].x;
  me.z = SPAWNS[Math.floor(Math.random()*SPAWNS.length)].z;

  if(isSolo){
    for(var i=0;i<6;i++) spawnTarget();
    $('roombox').style.display = 'none';
    $('plist').style.display = 'none';
    $('scorebox').style.display = 'block';
  } else {
    $('roombox').style.display = 'block';
    $('plist').style.display = 'flex';
    $('scorebox').style.display = 'none';
    $('roomcodeView').textContent = Net.code;
    $('onlineCount').textContent = '在线 1/' + MAX_PLAYERS;
    playerList.forEach(function(p){ if(p.i !== Net.selfId) addRemote(p); });
  }

  $('menu').style.display = 'none';
  $('hud').style.display = 'block';
  $('game-canvas').style.display = 'block';
  $('lockHint').style.display = 'flex';
  $('overlay').style.display = 'none';
  $('connectOverlay').style.display = 'none';
  $('pauseInfo').textContent = isSolo ? '单人试玩模式' : '联机对战进行中';
  document.documentElement.setAttribute('data-game','1');
}

function returnMenu(){
  Net.close();
  mode = 'menu';
  solo = false;
  keys = {}; mouseDown = false;
  $('menu').style.display = 'flex';
  $('hud').style.display = 'none';
  $('game-canvas').style.display = 'none';
  $('overlay').style.display = 'none';
  $('connectOverlay').style.display = 'none';
  $('lockHint').style.display = 'none';

/* ---------- 联网事件处理 ---------- */
function processIncoming(m){
  if(m.t === 'w'){
    Net.selfId = m.s;
    startGame(m.ps || [], false);
    return;
  }
  if(mode !== 'game') return;
  if(m.t === 'p'){
    var r = remotes.get(m.id);
    if(!r) return;
    r.tx = m.x; r.tz = m.z; r.tr = m.r;
    r.hp = m.hp; r.alive = !!m.a;
    r.k = m.k; r.d = m.d;
    var show = r.alive;
    if(r.mesh.visible !== show) r.mesh.visible = show;
    if(r.alive && r.hp >= 100) r.mesh.userData.hb.visible = false;
  } else if(m.t === 'sh'){
    spawnTracer(m);
  } else if(m.t === 'hit'){
    if(m.tgt === Net.selfId){ takeDamage(m.d, m.id); }
  } else if(m.t === 'd'){
    handleDeathMsg(m.id, m.by);
  } else if(m.t === 'rs'){
    var r2 = remotes.get(m.id);
    if(r2){ r2.alive = true; r2.hp = 100; r2.mesh.visible = true; r2.mesh.userData.hb.visible = false; }
  } else if(m.t === 'bye'){
    feed(nameOf(m.i) + ' 离开了房间');
    removeRemote(m.i);
  } else if(m.t === 'np'){
    if(m.p.i !== Net.selfId){ addRemote(m.p); feed(m.p.n + ' 加入了房间'); }
  } else if(m.t === 'full'){
    toast('房间已满员（8 人）');
    returnMenu();
  }
}

function takeDamage(dmg, by){
  if(!me || !me.alive) return;
  me.hp = Math.max(0, me.hp - dmg);
  me.lastHitBy = by;
  vignette = 0.55;
  sndHurt();
  if(me.hp <= 0){
    me.alive = false;
    me.deaths++;
    Net.send({t:'d', by:by});
    var killer = nameOf(by);
    $('deathTitle').textContent = '你被 ' + killer + ' 击败了';
    $('deathInfo').textContent = '3 秒后重生…';
    $('deathPanel').style.display = 'block';
    $('pausePanel').style.display = 'none';
    $('overlay').style.display = 'flex';
    me.respawnT = 3;
    feed('你被 ' + killer + ' 击败了');
  }
}

function handleDeathMsg(id, by){
  var kn = nameOf(by), dn = nameOf(id);
  if(by === Net.selfId){ me.kills++; sndKill(); feed('你击败了 ' + dn, true); }
  else if(id !== Net.selfId){ feed(kn + ' 击败了 ' + dn); }
  var r = remotes.get(id);
  if(r){ r.alive = false; r.hp = 0; r.mesh.visible = false; }
}

function respawn(){
  var s = pick(SPAWNS);
  me.x = s.x; me.z = s.z; me.y = 0; me.vy = 0;
  me.hp = 100; me.alive = true; me.ammo = MAG;
  me.ry = rnd(-3.1,3.1); me.pitch = 0;
  $('overlay').style.display = 'none';
  Net.send({t:'rs'});
  sndSpawn();
}

/* ---------- 主循环 ---------- */
function loop(t){
  requestAnimationFrame(loop);
  if(mode !== 'game' || !scene) return;
  var dt = Math.min(0.05, (t - (loop._last||t)) / 1000);
  loop._last = t;

  updatePlayer(dt);
  updateBullets(dt);
  updateFx(dt);
  updateTargets(dt);
  updateRemotes(dt);
  updateGun(dt);

  stateTimer += dt;
  if(stateTimer >= 0.05){
    stateTimer = 0;
    Net.send({t:'p', x:me.x, z:me.z, r:me.ry, hp:Math.round(me.hp), a:me.alive?1:0, k:me.kills, d:me.deaths});
  }
  listTimer += dt;
  if(listTimer >= 0.25){ listTimer = 0; renderList(); }

  renderer.render(scene, camera);
}

function updatePlayer(dt){
  if(!me.alive){
    me.respawnT -= dt;
    if(me.respawnT <= 0) respawn();
    return;
  }
  if(locked){
    var f = (keys['KeyW']?1:0) - (keys['KeyS']?1:0);
    var s = (keys['KeyD']?1:0) - (keys['KeyA']?1:0);
    var sp = keys['ShiftLeft'] || keys['ShiftRight'] ? SPRINT : MOVE;
    var fx = -Math.sin(me.ry), fz = -Math.cos(me.ry);
    var rx = Math.cos(me.ry), rz = -Math.sin(me.ry);
    var dx = (fx*f + rx*s), dz = (fz*f + rz*s);
    var len = Math.sqrt(dx*dx + dz*dz);
    if(len > 0.001){
      dx /= len; dz /= len;
      me.x += dx * sp * dt;
      me.z += dz * sp * dt;
      collide(me);
      bobT += dt * (sp / MOVE) * 11;
    }
    if(keys['Space'] && me.onGround){ me.vy = JUMP; me.onGround = false; sndJump(); }
  }
  me.vy += GRAV * dt;
  me.y += me.vy * dt;
  if(me.y <= 0){ me.y = 0; me.vy = 0; me.onGround = true; }

  camera.position.set(me.x, me.y + EYE, me.z);
  camera.rotation.y = me.ry;
  camera.rotation.x = me.pitch;

  /* 射击 */
  if(mouseDown && locked){
    var now = performance.now() / 1000;
    if(now - lastShot >= FIRE_INTERVAL){
      if(reloading){ /* 等换弹完成 */ }
      else if(me.ammo <= 0){ startReload(); }
      else fire(now);
    }
  }
  if(reloading){
    reloadT -= dt;
    if(reloadT <= 0){ reloading = false; me.ammo = MAG; $('gunstate').textContent = MAG + ' / ∞'; }
  }
  hmT -= dt;
  if(hmT > 0) $('hitmarker').style.opacity = '1';
  else $('hitmarker').style.opacity = '0';
  vignette *= Math.exp(-7 * dt);
  $('vignette').style.opacity = vignette.toFixed(3);

  $('hpfill').style.width = me.hp + '%';
  $('hpval').textContent = Math.round(me.hp);
  $('gunstate').textContent = reloading ? '换弹中…' : me.ammo + ' / ∞';
  $('ammo').innerHTML = reloading ? '<span style="color:#ff9f43">换弹中…</span>' : (me.ammo + ' <b>/</b> ∞');
}

function collide(pl){
  var r = PLAYER_R;
  pl.x = clamp(pl.x, -ARENA + r, ARENA - r);
  pl.z = clamp(pl.z, -ARENA + r, ARENA - r);
  for(var i=0;i<OBSTACLES.length;i++){
    var o = OBSTACLES[i];
    var minX = o.x - o.sx/2 - r, maxX = o.x + o.sx/2 + r;
    var minZ = o.z - o.sz/2 - r, maxZ = o.z + o.sz/2 + r;
    if(pl.x > minX && pl.x < maxX && pl.z > minZ && pl.z < maxZ){
      var dl = pl.x - minX, dr = maxX - pl.x, db = pl.z - minZ, dt2 = maxZ - pl.z;
      var mn = Math.min(dl, dr, db, dt2);
      if(mn === dl) pl.x = minX; else if(mn === dr) pl.x = maxX;
      else if(mn === db) pl.z = minZ; else pl.z = maxZ;
    }
  }
}

function fire(now){
  lastShot = now;
  me.ammo--;
  recoil = 1;
  sndShot();
  var dir = new THREE.Vector3();
  camera.getWorldDirection(dir);
  var o = camera.position.clone().addScaledVector(dir, 0.55);
  var b = bullets[0];
  for(var i=1;i<bullets.length;i++){ if(!bullets[i].on){ b = bullets[i]; break; } }
  b.on = true; b.life = BULLET_RANGE / BULLET_SPEED;
  b.p.copy(o);
  b.v.copy(dir).multiplyScalar(BULLET_SPEED);
  b.m.position.copy(o); b.m.visible = true;
  gunObj.userData.muzzle.intensity = 1.3;
  Net.send({t:'sh', x:o.x, y:o.y, z:o.z, dx:dir.x, dy:dir.y, dz:dir.z});
  if(me.ammo <= 0) startReload();
}

function startReload(){
  if(reloading || me.ammo >= MAG) return;
  reloading = true; reloadT = RELOAD_T;
  sndReload();
}

function updateBullets(dt){
  for(var i=0;i<bullets.length;i++){
    var b = bullets[i];
    if(!b.on) continue;
    b.life -= dt;
    b.p.addScaledVector(b.v, dt);
    b.m.position.copy(b.p);
    var hit = false;
    if(b.p.y < 0.05 || Math.abs(b.p.x) > ARENA - 0.1 || Math.abs(b.p.z) > ARENA - 0.1){
      hit = true; burst(b.p, 0xff9f43);
    } else {
      for(var j=0;j<OBSTACLES.length;j++){
        var o = OBSTACLES[j];
        if(b.p.x > o.x - o.sx/2 && b.p.x < o.x + o.sx/2 &&
           b.p.z > o.z - o.sz/2 && b.p.z < o.z + o.sz/2 &&
           b.p.y > 0 && b.p.y < o.h){
          hit = true; burst(b.p, 0x8fd0ff); break;
        }
      }
    }
    if(!hit && !solo){
      remotes.forEach(function(r){
        if(!r.alive || hit) return;
        var dx = b.p.x - r.tx, dz = b.p.z - r.tz;
        if(dx*dx + dz*dz < 0.62*0.62 && b.p.y > 0.1 && b.p.y < 1.95){
          hit = true;
          burst(b.p, 0xff5d5d);
          sndHit();
          $('hitmarker').style.opacity = '1'; hmT = 0.09;
          Net.send({t:'hit', tgt:r.pid, d:DMG});
        }
      });
    }
    if(!hit && solo){
      for(var k=0;k<targets.length;k++){
        var tg = targets[k];
        if(!tg.m.visible) continue;
        var d2 = b.p.distanceToSquared(tg.m.position);
        if(d2 < 0.75*0.75){
          hit = true; score++;
          $('scoreNum').textContent = score;
          sndHit();
          $('hitmarker').style.opacity = '1'; hmT = 0.09;
          burst(b.p, 0xff9f43);
          tg.m.position.set(rnd(-40,40), rnd(1.3,2.6), rnd(-40,40));
        }
      }
    }
    if(hit || b.life <= 0){
      b.on = false; b.m.visible = false;
    }
  }
}

function updateFx(dt){
  for(var i=0;i<parts.length;i++){
    var p = parts[i];
    if(!p.m.visible) continue;
    p.life -= dt;
    if(p.life <= 0){ p.m.visible = false; continue; }
    p.v.y -= 16 * dt;
    p.m.position.addScaledVector(p.v, dt);
    p.m.material.opacity = p.life / p.max;
    var sc = 0.5 + 0.5 * (p.life / p.max);
    p.m.scale.set(sc, sc, sc);
  }
  for(i=0;i<tracers.length;i++){
    var tr = tracers[i];
    if(!tr.m.visible) continue;
    tr.life -= dt;
    tr.m.material.opacity = Math.max(0, 0.85 * tr.life / 0.09);
    if(tr.life <= 0) tr.m.visible = false;
  }
}

function updateTargets(dt){
  if(!solo) return;
  var t2 = performance.now() / 1000;
  for(var i=0;i<targets.length;i++){
    var t = targets[i];
    if(!t.m.visible) continue;
    t.m.position.x = t.x + Math.sin(t2 * t.sp + t.ph) * t.amp;
    t.m.position.y = t.y + Math.sin(t2 * t.sp * 1.7 + t.ph * 2) * 0.35;
    t.m.position.z = t.z + Math.cos(t2 * t.sp * 0.8 + t.ph) * t.amp * 0.7;
    t.m.rotation.y += dt;
  }
}

function updateRemotes(dt){
  var k = 1 - Math.exp(-13 * dt);
  remotes.forEach(function(r){
    if(!r.mesh.visible) return;
    var m = r.mesh;
    m.position.x += (r.tx - m.position.x) * k;
    m.position.z += (r.tz - m.position.z) * k;
    var diff = r.tr - m.rotation.y;
    while(diff > Math.PI) diff -= Math.PI*2;
    while(diff < -Math.PI) diff += Math.PI*2;
    m.rotation.y += diff * k;
    var fg = m.userData.hpFg, hb = m.userData.hb;
    if(r.alive && r.hp < 100){
      hb.visible = true;
      fg.scale.x = clamp(r.hp / 100, 0, 1);
      fg.material.color.set(r.hp > 60 ? 0x2fe08a : (r.hp > 30 ? 0xffd23e : 0xff4757));
    } else {
      hb.visible = false;
    }
  });
}

function updateGun(dt){
  recoil *= Math.exp(-14 * dt);
  var bob = me && me.alive && (keys['KeyW']||keys['KeyA']||keys['KeyS']||keys['KeyD']) && me.onGround ? Math.sin(bobT) * 0.012 : 0;
  gunObj.position.z = -0.5 + recoil * 0.12;
  gunObj.position.y = -0.21 + bob + recoil * 0.02;
  gunObj.rotation.x = recoil * 0.16;
  if(gunObj.userData.muzzle.intensity > 0){
    gunObj.userData.muzzle.intensity *= Math.exp(-40 * dt);
  }
}

function renderList(){
  if(solo) return;
  var html = '';
  if(me){
    html += '<div class="row me"><span class="dotc" style="background:#2fe6c8"></span>' +
      '<span class="nm">' + escHtml(myName) + '</span><span class="k">' + me.kills + '</span>' +
      '<span class="bar"><i style="width:' + Math.max(0,me.hp) + '%; background:' + (me.hp>60?'#2fe08a':(me.hp>30?'#ffd23e':'#ff4757')) + '"></i></span></div>';
  }
  remotes.forEach(function(r){
    html += '<div class="row"><span class="dotc" style="background:' + r.color + '"></span>' +
      '<span class="nm">' + escHtml(r.name) + '</span><span class="k">' + r.k + '</span>' +
      '<span class="bar"><i style="width:' + Math.max(0,r.hp) + '%; background:' + (r.hp>60?'#2fe08a':(r.hp>30?'#ffd23e':'#ff4757')) + '"></i></span></div>';
  });
  $('plist').innerHTML = html;
  $('onlineCount').textContent = '在线 ' + (remotes.size + 1) + '/' + MAX_PLAYERS;
}
function escHtml(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

/* ---------- 房间流程 ---------- */
function hostRoom(){
  var code = ($('roomcode').value || '').trim().toUpperCase();
  if(!/^[A-Z2-9]{5}$/.test(code)) code = genCode();
  $('roomcode').value = code;
  myName = getNick();
  ensureAudio();
  Net.selfId = 1;
  Net.startHost(code, function(){
    Net.code = code;
    startGame([], false);
  });
}

function joinRoom(){
  var code = ($('roomcode').value || '').trim().toUpperCase();
  if(!/^[A-Z2-9]{5}$/.test(code)){ toast('请输入 5 位房间号（大写字母或数字）'); return; }
  myName = getNick();
  ensureAudio();
  showConnect(true);
  Net.startJoin(code, function(){
    Net.send({t:'j', n:myName});
  });
}

function getNick(){
  var n = ($('nick').value || '').trim().slice(0,12);
  return n || ('狂电猴' + Math.floor(rnd(10,99)));
}

function startSolo(){
  myName = getNick();
  ensureAudio();
  Net.selfId = 1;
  Net.close();
  startGame([], true);
}

/* ---------- 输入绑定 ---------- */
function bindInput(){
  var canvas = $('game-canvas');
  canvas.addEventListener('click', function(){
    if(mode === 'game' && (!me || me.alive)){ try{ canvas.requestPointerLock(); }catch(e){} }
  });
  $('lockHint').addEventListener('click', function(){
    if(mode === 'game' && (!me || me.alive)){ try{ canvas.requestPointerLock(); }catch(e){} }
  });
  canvas.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  document.addEventListener('pointerlockchange', function(){
    locked = document.pointerLockElement === canvas;
    if(locked){
      $('lockHint').style.display = 'none';
      if(!me || me.alive) $('overlay').style.display = 'none';
    } else if(mode === 'game'){
      $('lockHint').style.display = 'flex';
      $('lockHint').querySelector('.ph').textContent = '已暂停';
      $('lockHint').querySelector('.ps').textContent = '点击画面继续战斗 · 当前为暂停状态';
      $('pausePanel').style.display = 'block';
      $('deathPanel').style.display = 'none';
      $('overlay').style.display = 'flex';
    }
  });
  document.addEventListener('pointerlockerror', function(){ toast('无法锁定鼠标，请点击画面重试'); });
  document.addEventListener('mousemove', function(e){
    if(!locked || !me || !me.alive) return;
    me.ry -= e.movementX * SENS;
    me.pitch -= e.movementY * SENS;
    me.pitch = clamp(me.pitch, -1.45, 1.45);
  });
  document.addEventListener('mousedown', function(e){
    if(e.button === 0 && locked){ mouseDown = true; }
  });
  document.addEventListener('mouseup', function(e){
    if(e.button === 0) mouseDown = false;
  });
  document.addEventListener('keydown', function(e){
    keys[e.code] = true;
    if(e.code === 'Space') e.preventDefault();
    if(e.code === 'KeyR' && mode === 'game' && me && me.alive){ startReload(); }
    if(e.code === 'KeyM' && mode === 'game'){ toggleMute(); }
  });
  document.addEventListener('keyup', function(e){ keys[e.code] = false; });
  window.addEventListener('resize', function(){
    if(!renderer) return;
    renderer.setSize(window.innerWidth, window.innerHeight);
    if(camera) camera.aspect = window.innerWidth / window.innerHeight;
    if(camera) camera.updateProjectionMatrix();
  });
  window.addEventListener('beforeunload', function(){ Net.close(); });
}

function toggleMute(){
  audio.on = !audio.on;
  $('mute').textContent = '音效：' + (audio.on ? '开' : '关');
  if(audio.gain) audio.gain.gain.value = audio.on ? 0.35 : 0;
}

/* ---------- 菜单绑定 ---------- */
function bindMenu(){
  $('nick').value = '狂电猴' + Math.floor(rnd(10,99));
  $('btn-gen').addEventListener('click', function(){ $('roomcode').value = genCode(); });
  $('btn-create').addEventListener('click', function(){
    if(!window.THREE){ toast('3D 引擎尚未加载完成，请稍候'); return; }
    hostRoom();
  });
  $('btn-join').addEventListener('click', function(){
    if(!window.THREE){ toast('3D 引擎尚未加载完成，请稍候'); return; }
    joinRoom();
  });
  $('btn-solo').addEventListener('click', function(){
    if(!window.THREE){ toast('3D 引擎尚未加载完成，请稍候'); return; }
    startSolo();
  });
  $('btn-resume').addEventListener('click', function(){
    $('overlay').style.display = 'none';
    try{ $('game-canvas').requestPointerLock(); }catch(e){}
  });
  $('btn-leave').addEventListener('click', function(){ returnMenu(); });
  $('btn-copy').addEventListener('click', function(){
    var c = $('roomcodeView').textContent;
    if(c && c !== '------'){
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(c).then(function(){ toast('房间号已复制：' + c); }, function(){ toast('复制失败，请手动记下房间号'); });
      } else { toast('房间号：' + c); }
    }
  });
  $('mute').addEventListener('click', toggleMute);
}

/* ---------- 启动：加载 CDN（带镜像回退） ---------- */
function loadScript(src){
  return new Promise(function(res, rej){
    var s = document.createElement('script');
    s.src = src; s.async = true;
    s.onload = function(){ res(); };
    s.onerror = function(){ rej(new Error('load fail: ' + src)); };
    document.head.appendChild(s);
  });
}
var THREE_URLS = [
  'https://fastly.jsdelivr.net/npm/three@0.128.0/build/three.min.js',
  'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js'
];
var PEER_URLS = [
  'https://fastly.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js',
  'https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js'
];
async function boot(){
  bindInput();
  bindMenu();
  Net.onData = processIncoming;
  Net.onError = function(e){
    var t = e && e.type;
    if(t === 'peer-unavailable') toast('房间不存在或已解散，请核对房间号');
    else if(t === 'network' || t === 'server-error' || t === 'socket-error') toast('网络连接失败，请检查网络后重试');
    else if(t === 'browser-incompatible') toast('当前浏览器不支持 WebRTC 联机');
    else toast('联机错误：' + (t || '未知'));
    if(mode === 'game' && !Net.host){ showConnect(false); returnMenu(); }
    if(mode === 'menu') showConnect(false);
  };
  Net.onHostLeft = function(){
    toast('房主已退出游戏，房间解散');
    showConnect(false);
    returnMenu();
  };
  try{
    await loadScript(THREE_URLS[0]);
  }catch(e1){
    await loadScript(THREE_URLS[1]);
  }
  if(!window.THREE){
    toast('3D 引擎加载失败，请检查网络后刷新页面');
    return;
  }
  try{
    await loadScript(PEER_URLS[0]);
  }catch(e2){
    await loadScript(PEER_URLS[1]);
  }
  if(!window.Peer){
    toast('联机服务加载失败，只能使用单人试玩');
    $('btn-create').disabled = true;
    $('btn-join').disabled = true;
  }
  requestAnimationFrame(loop);
  document.documentElement.setAttribute('data-boot','1');
}
boot();
</script>
